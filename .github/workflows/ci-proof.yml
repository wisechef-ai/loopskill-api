name: ci-proof

# moneypath G8 (build half): every run on main and every PR uploads a
# machine-readable ci-proof.json artifact recording WHAT was actually
# verified on that commit — test counts collected/passed, lint status,
# commit SHA, run URL. A green checkmark alone proves nothing.
#
# ubuntu-latest (NOT wisechef-runner): this workflow runs arbitrary PR
# code (pip install -e ., pre-commit hooks, the PR's own tests) and the
# repo is public — a fork PR must never touch persistent self-hosted infra.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: CI proof artifact (ci-proof.json)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: recipes_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
          python -m pip install pytest pytest-asyncio pytest-timeout coverage httpx fastapi sqlalchemy psycopg2-binary python-frontmatter pre-commit

      # Failures must be RECORDED in the proof, not abort before it — both
      # lint and pytest run continue-on-error and are gated afterwards.
      - name: "Lint (pre-commit: ruff + bandit + scoped mypy)"
        id: lint
        continue-on-error: true
        run: pre-commit run --all-files

      - name: Run full pytest (JUnit XML)
        id: pytest
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/recipes_ci"
          STRIPE_SECRET_KEY: "sk_test_dummy"
          STRIPE_WEBHOOK_SECRET: "whsec_dummy"
          ENVIRONMENT: test
          WITH_POSTGRES: "1"
          POSTGRES_DSN: "postgresql://ci:ci@localhost:5432/postgres"
        continue-on-error: true
        run: |
          python -m pytest tests/ \
            --junitxml=test-results/pytest.junit.xml \
            --timeout=120 \
            --timeout-method=thread \
            --ignore=tests/migrations \
            --ignore=scripts \
            -q

      - name: Build ci-proof.json
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          test_status="fail"
          [ "$PYTEST_OUTCOME" = "success" ] && test_status="pass"
          lint_status="fail"
          [ "$LINT_OUTCOME" = "success" ] && lint_status="pass"
          # The mypy scope here is pre-commit's designated 4 modules, not a
          # repo-wide typecheck — the proof records it under a prefixed name
          # the schema's typecheck assertion matches on.
          python scripts/ci_proof.py build \
            --junit-glob "test-results/*.xml" \
            --status "tests:$test_status" \
            --status "lint:$lint_status" \
            --status "typecheck-mypy-scoped-4-modules:$lint_status" \
            --output ci-proof.json
          python scripts/ci_proof.py verify ci-proof.json

      - name: Fail the job if lint or tests failed (proof is recorded first)
        if: steps.lint.outcome != 'success' || steps.pytest.outcome != 'success'
        run: |
          echo "::error::lint/pytest failed — see the ci-proof artifact for facts."
          exit 1

      - name: Upload CI proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof
          path: ci-proof.json
          retention-days: 90
