name: Random order tests

# Runs the FULL pytest suite in randomized order with pytest-randomly, on both
# engines, to surface order-dependent tests (shared-state leaks).
#
# Policy change — t_555b26e2 (2026-11-16), replacing the issue #300 decision
# ("add it as a regression guard first, consider gating once it is stable").
# ---------------------------------------------------------------------------
# It used to run on `pull_request` with `continue-on-error: true`. That
# combination produced a red cell nobody acted on, which is worse than no job at
# all: it still costs a reviewer a decision about whose fault it is, and it
# trains them to ignore the column.
#
# Measured before changing anything (17 workflow runs / 34 legs, 2026-11-16):
#
#   - 4 of 34 legs red (12%). Every one was a DETERMINISTIC suite-wide gate, not
#     an order effect: test_w0_2_pyfile_size_discipline, test_w0_5_tier_vocab_audit,
#     test_readme_claims. All three are ordinary tests the BLOCKING
#     `pytest + coverage` job runs too — and on BOTH red commits checked side by
#     side (ef7cfecc, 8711bac2) ci.yml's `pytest + coverage (sqlite)` and
#     `(postgres)` jobs went red in the same minute. So the PR-time red cell
#     carried no information the required checks did not already carry.
#   - The two tests this card was filed for were the only genuinely
#     non-reproducible failures, and neither was order-dependent:
#       * issue282 fed_hub trgm RED-proof seq-scan — a planner assertion that
#         trusted stats left behind by other tests. Fixed on main in a09c99f
#         (#473) by running the proof on a private, session-scoped TEMP table.
#       * test_m1_private_bundle_meter `'float' object has no attribute
#         'replace'` — NOT a shuffle effect. app/models.py typed every uuid column
#         as sqlalchemy.dialects.postgresql.UUID, which has no SQLite compiler, so
#         SQLite saw the bare type name UUID, gave the column NUMERIC affinity,
#         and coerced a numeric-shaped uuid4 hex (all digits, or <digits>e<digits>)
#         into a REAL — sometimes inf. Whether a run hit it depended on
#         os.urandom, which pytest-randomly does not seed: P ~ 1.2e-6 per uuid, so
#         replaying the published seed reproduced nothing. Fixed in app/models.py
#         (sqlalchemy.Uuid — identical Postgres DDL, CHAR(32) on SQLite) and pinned
#         by tests/test_t555b26e2_sqlite_uuid_affinity.py.
#
# The shuffle was never the coin flip; the coin flip was a latent product bug,
# now removed. The job keeps what it is uniquely good at — detecting order
# dependence — and runs where a red is actionable:
#
#   - `push` to main and the nightly schedule are BLOCKING (no continue-on-error).
#     A failure cannot block a merge — the merge already happened — but it turns
#     the branch red and opens/refreshes a tracking issue automatically, so an
#     order-dependent test can no longer be silently tolerated.
#   - `workflow_dispatch` stays for replaying a published seed.
#   - It no longer runs on `pull_request`. A PR that introduces order dependence
#     is caught on main within ~24h instead of at PR time. That is the deliberate
#     trade: coverage that is trusted beats coverage that is ignored — and its
#     deterministic findings were duplicates of ci.yml anyway (see the measurement
#     above), so nothing unique is lost. If this job goes 14 consecutive days
#     green on main, adding `pull_request` back is a one-line change.
#
#   - Failures found here are tracked as issues (see #300, #420, #454, #473).
#
# Why pytest-randomly (not pytest-random-order): it prints the seed in the pytest
# header (`Using --randomly-seed=N`), shuffles modules, classes and functions, and
# also reseeds `random` per test. It is installed ONLY in this workflow's install
# step; it is not (and must not be) in requirements.txt or ci.yml.
#
# Reproducing a failure locally (use the seed from the run log / job summary):
#
#   # same relative order, serial, deterministic:
#   DATABASE_URL=<sqlite:///:memory: | postgresql://...> \
#     python -m pytest -q -p no:cacheprovider -p randomly -n 0 --randomly-seed=N
#   # NOTE: use `-n 0`, NOT `-p no:xdist`: the suite uses xdist's `worker_id`
#   # fixture, which only exists while the plugin is loaded (`-n 0` = in-process).
#
#   # one file's order only (fast triage): add the suspect test files after the options.
#
# Host parity (t_555b26e2): conftest.py pins WR_REDIS_URL blank. If you export a
# real WR_REDIS_URL to reproduce, you also inherit a process-wide shared
# rate-limit bucket and get ~21 extra 429-shaped failures CI cannot produce.
# Reproduce without it.
#
# Seed-vs-reality caveat (t_555b26e2): the published seed pins the ORDER only.
# Anything a test draws from `os.urandom` — every `uuid4()` primary key — is
# outside the seed, so "red on seed N, green when I replay seed N" is the
# expected signature of a data-dependent defect. Do not conclude "not
# reproducible, therefore not real"; look for a data-dependent cause before
# blaming the shuffle. That misread is what let the uuid-affinity bug below
# survive being called an order-dependent flake.
#
# xdist note: this job uses `-n auto --dist loadfile` like ci.yml. pytest-randomly
# seeds every xdist worker identically, so all workers see the same shuffled order,
# and `loadfile` then keeps each file on one worker. Which files share a worker is
# decided at run time by xdist scheduling and is NOT reproducible from the seed, so
# the serial command above reproduces the ORDER, not the shard composition. If a
# failure only appears under xdist, re-run with `-n 8 --dist loadfile
# --randomly-seed=N` (best effort) and read the per-worker test list in the log.
#
# The same seed can be replayed in CI via workflow_dispatch (`seed` input).
# To turn the shuffle off for a given run use `-p no:randomly`.

on:
  push:
    branches: [main]
  schedule:
    # Nightly, 03:17 UTC (off the hour to avoid the scheduler rush).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "pytest-randomly seed to replay (integer). Empty = random seed."
        required: false
        default: ""
        type: string

concurrency:
  group: random-order-${{ github.event_name }}-${{ github.ref }}
  # Never cancel: a red nightly is evidence, and a later push must not eat it.
  cancel-in-progress: false

permissions:
  contents: read
  # Used by "Open or refresh tracking issue" so a red main cannot be ignored.
  issues: write

jobs:
  random-order:
    name: random-order pytest (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # BLOCKING since t_555b26e2 — see header. Runs only on push-to-main / nightly
    # / dispatch, where a red result must be loud. It never runs on pull_request,
    # so it cannot gate a merge.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    # Same Postgres service as ci.yml (postgres:17 matches docker-compose.prod.yml).
    # Started on both legs; the sqlite leg simply never connects to it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopskill
          POSTGRES_PASSWORD: loopskill
          POSTGRES_DB: loopskill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WR_DATABASE_URL: "sqlite:///:memory:"
      # Same engine-selection contract as ci.yml: DATABASE_URL drives
      # tests/conftest.py, WR_DATABASE_URL stays sqlite.
      DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql://loopskill:loopskill@localhost:5432/loopskill_test' || 'sqlite:///:memory:' }}
      SEED_INPUT: ${{ github.event.inputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-randomly is installed HERE ONLY (never in requirements.txt).
          pip install pytest pytest-xdist pytest-timeout pytest-randomly
      - name: Run tests in random order
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          # Always pass an EXPLICIT seed and echo it ourselves: `-q` suppresses
          # pytest-randomly's "Using --randomly-seed=N" header, so relying on the
          # plugin to print it loses the seed.
          SEED="${SEED_INPUT}"
          if [ -z "${SEED}" ]; then
            SEED=$(python -c 'import random; print(random.SystemRandom().randrange(1, 2**32))')
          elif ! [[ "${SEED}" =~ ^[0-9]+$ ]]; then
            echo "::error::seed input must be an integer, got '${SEED}'"
            exit 2
          fi
          echo "Using --randomly-seed=${SEED}" | tee pytest-random-order.log
          echo "SEED=${SEED}" >> "$GITHUB_ENV"
          python -m pytest -q -p no:cacheprovider -p randomly --randomly-seed="${SEED}" \
            -n auto --dist loadfile \
            --junitxml="junit-random-order-${{ matrix.engine }}.xml" \
            2>&1 | tee -a pytest-random-order.log
      - name: Summarize seed and result
        if: always()
        shell: bash
        run: |
          SEED=$(grep -m1 -o 'randomly-seed=[0-9]*' pytest-random-order.log | cut -d= -f2 || true)
          OUTCOME="${{ steps.pytest.outcome }}"
          {
            echo "### random-order pytest (${{ matrix.engine }}): ${OUTCOME}"
            echo ""
            echo "- seed: \`${SEED:-unknown}\`"
            echo "- reproduce (serial): \`python -m pytest -q -p no:cacheprovider -p randomly -n 0 --randomly-seed=${SEED:-N}\`"
            echo "- replay in CI: Actions → Random order tests → Run workflow → seed=${SEED:-N}"
            echo ""
            grep -E '^(FAILED|ERROR) ' pytest-random-order.log | head -50 || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${OUTCOME}" != "success" ]; then
            # Blocking since t_555b26e2: a red here is a red main, not a warning.
            echo "::error title=random-order (${{ matrix.engine }}) failed::seed=${SEED:-unknown}; main is red. See job summary / junit artifact."
          fi
      - name: Open or refresh tracking issue
        # Only for events that represent real main state — a dispatched seed
        # replay is an investigation, not a regression report.
        if: failure() && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          LABEL="random-order-flake"
          SEED=$(grep -m1 -o 'randomly-seed=[0-9]*' pytest-random-order.log | cut -d= -f2 || true)
          SEED="${SEED:-unknown}"
          FAILING=$(grep -E '^(FAILED|ERROR) ' pytest-random-order.log | head -20 || true)
          # One open issue PER ENGINE. A nightly that stays red for 30 nights must
          # not file 30 issues, or the label becomes the same noise the red cell was.
          gh label create "$LABEL" --color F9D0C4 \
            --description "random-order pytest job is red on main" >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --label "$LABEL" --state open \
            --search "$ENGINE in:title" --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" \
              --body "Still red — seed \`$SEED\`, commit \`$COMMIT\`, run $RUN_URL."
            echo "refreshed existing issue #$EXISTING"
          else
            BODY="The blocking \`random-order\` job is red on main for the **$ENGINE** engine.

          | | |
          |---|---|
          | seed | \`$SEED\` |
          | commit | \`$COMMIT\` |
          | run | $RUN_URL |
          | artifact | \`random-order-$ENGINE\` (junit XML + full log) |

          Reproduce (serial, same relative order):

              python -m pytest -q -p no:cacheprovider -p randomly -n 0 --randomly-seed=$SEED

          Two checks before chasing it: the seed pins ORDER only — anything drawn
          from \`os.urandom\` (every \`uuid4()\` PK) is outside it, so look for a
          data-dependent cause before assuming a shared-state leak — and if the
          same test is red in ci.yml's \`pytest + coverage\` job too, it is not an
          order-dependent test at all.

          <details><summary>failing tests</summary>

              $FAILING

          </details>"
            gh issue create --title "[random-order] $ENGINE leg red on main" \
              --label "$LABEL" --body "$BODY"
          fi
      - name: Upload junit XML and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-order-${{ matrix.engine }}
          path: |
            junit-random-order-${{ matrix.engine }}.xml
            pytest-random-order.log
          if-no-files-found: warn
          retention-days: 14
