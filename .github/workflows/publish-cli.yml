name: Publish loopskill CLI to PyPI

# Publishes the `cli/` package (PyPI name: loopskill) whenever a tag matching
# the CLI's own namespaced convention is pushed. There is NO pre-existing tag
# convention in this repo (git tag --list is empty; 0.1.0 and 0.2.0 were both
# published manually via `twine upload` from a maintainer's machine — see PR
# body for the full paper trail). The `loopskill-v*` prefix is a NEW,
# deliberately CLI-scoped convention chosen here so a future server-level
# release tag (this is a monorepo: app/ + cli/) never collides with or
# accidentally triggers a CLI publish.
#
# ONE-TIME MANUAL SETUP REQUIRED before this workflow can publish (see PR
# description for the full checklist):
# AUTH: this workflow publishes with the `PYPI_API_TOKEN` repo secret when it
# exists, and falls back to OIDC Trusted Publishing when it does not (see the
# publish step). Trusted Publishing is still the preferred end state; to switch
# to it, complete step 1 below and delete the secret. Step 2 is already done.
#
#   1. On pypi.org, under the `loopskill` project -> Publishing, add a
#      Trusted Publisher:
#        Owner:            wisechef-ai
#        Repository name:  loopskill-api
#        Workflow name:    publish-cli.yml
#        Environment name: pypi
#   2. In this GitHub repo's Settings -> Environments, create an environment
#      named `pypi` (protection rules optional, e.g. require a reviewer).
# No PyPI token/secret is created or stored by this workflow — it uses OIDC
# Trusted Publishing exclusively.

on:
  push:
    tags:
      - "loopskill-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (e.g. loopskill-v0.3.0). Must already exist."
        required: true

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify, and publish loopskill to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC); no stored secret
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve tag name
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            RAW="${{ inputs.tag }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $RAW"

      - name: Guard — tag must match loopskill-vX.Y.Z
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          if ! [[ "$TAG" =~ ^loopskill-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match required pattern 'loopskill-vX.Y.Z'"
            exit 1
          fi

      - name: Guard — tag version must match cli/pyproject.toml version
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG#loopskill-v}"
          PYPROJECT_VERSION=$(python3 -c "
          import tomllib
          with open('cli/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "Tag version:       $TAG_VERSION"
          echo "pyproject version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $TAG (version $TAG_VERSION) does not match cli/pyproject.toml version $PYPROJECT_VERSION. Refusing to publish a mismatched release."
            exit 1
          fi

      - name: Install build + twine
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel cli -o cli/dist

      - name: twine check
        run: twine check cli/dist/*

      - name: Publish to PyPI (token if configured, else Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist
          # DUAL PATH, deliberately in this order (2026-09-03).
          #
          # The first real run of this workflow (tag loopskill-v0.3.0, run
          # 33741393929) passed every guard, built both artifacts and passed
          # `twine check` — then failed at upload with PyPI's
          # `invalid-publisher: valid token, but no corresponding publisher`.
          # The OIDC claims were exactly as documented
          # (sub=repo:wisechef-ai/loopskill-api:environment:pypi), so the code
          # was correct; what was missing was the ONE-TIME manual registration
          # on pypi.org, which lives outside this repo and outside CI.
          #
          # `password` is left as an unset-tolerant expression: when the
          # PYPI_API_TOKEN secret is absent it renders empty, and
          # gh-action-pypi-publish falls back to Trusted Publishing exactly as
          # before. So configuring the Trusted Publisher later needs no code
          # change here — delete the secret and OIDC resumes.
          #
          # The token is a project-scoped PyPI API token held in the
          # maintainer's vault; it is never printed by this workflow (the
          # action masks it) and never leaves the `pypi` environment.
          password: ${{ secrets.PYPI_API_TOKEN }}
