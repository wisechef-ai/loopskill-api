name: CI

# Public CI for the open-source LoopSkill repo. Runs on GitHub-hosted runners
# (no self-hosted infra required) so any contributor's fork and PR gets the same
# green/red signal. Lint + tests + secret-scan are the gates that matter for OSS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check app/
      - name: ruff format --check
        run: ruff format --check app/

  test:
    name: pytest + coverage (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # Backstop for a hung suite. Without this a blocked test rides GitHub's
    # 6h default; on 2026-08-03 five Dependabot PRs sat in_progress for hours
    # with no signal. Per-test timeout lives in pyproject.toml; this is the
    # job-level belt to that braces.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    # mesh0408 T0-A: Postgres service container so the suite runs against
    # BOTH engines. Production is Postgres; SQLite alone never exercised
    # CHECK constraints or other dialect-specific behaviour. postgres:17
    # matches docker-compose.prod.yml (verified 2026-08-04). The container
    # starts unconditionally on both matrix legs (GitHub Actions service
    # containers can't be conditionally skipped per-matrix-value without
    # duplicating the job) — the sqlite leg simply never connects to it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopskill
          POSTGRES_PASSWORD: loopskill
          POSTGRES_DB: loopskill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WR_DATABASE_URL: "sqlite:///:memory:"
      # DATABASE_URL drives tests/conftest.py's engine selection (see
      # _test_database_url()). WR_DATABASE_URL stays sqlite even on the
      # postgres leg so app.config.Settings' production-secrets gate is
      # never triggered by the test job — only the test suite's own engine
      # switches, matching the "app boots on sqlite defaults, tests can
      # point elsewhere" contract already documented in conftest.py.
      DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql://loopskill:loopskill@localhost:5432/loopskill_test' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-cov pytest-timeout
      - name: Run tests
        run: |
          python -m pytest -q -p no:cacheprovider -n auto --dist loadfile \
            --cov=app --cov-report=term-missing --cov-fail-under=80

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --no-banner --redact
