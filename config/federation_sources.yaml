# SSOT for federation registry sources — bundles_0811 Phase P3.5.
#
# Locked decision #10 (Adam 2026-08-10): adding a new federation registry
# must be SELF-SERVE-PROPOSABLE and accepting a proposal must be a DATA EDIT,
# not a code change. Before this file existed, the full 14-source list was a
# Python tuple in app/services/federation.py (LIVE_SOURCES) built by
# concatenating this file's `adapter_sources` with the GitHub-tap facets that
# used to live in app/services/github_taps.py as a hardcoded tuple.
#
# Two source classes:
#
#   adapter_sources — bespoke non-GitHub sources, each backed by a hand-written
#   SourceAdapter subclass in app/services/federation_adapters.py (different
#   wire protocol per source: hermes-hub's envelope, clawhub's API, lobehub's
#   agent JSON, well-known's discovery convention, skills.sh's search API,
#   github-oss's code-search). A wholly new non-GitHub protocol still needs an
#   adapter class written in Python — that is inherent, the wire format
#   differs — but its final ENABLEMENT/registration into the live source list
#   is this file, not federation.py.
#
#   github_taps — GitHub repo + path + license + trust tuples served by the
#   ONE parameterized GitHubTapAdapter (app/services/federation_adapters.py).
#   THIS is the pure self-serve path: accepting a self-serve
#   POST /api/federation/propose (or loopskill_propose_registry) submission
#   for a GitHub-hosted skill collection is exactly appending one entry here.
#   NO PYTHON CHANGE required.
#
# To change display/pricing-style behaviour: edit ONLY this file. Verified by
# tests/test_federation_propose.py::test_all_14_preexisting_sources_survive.
#
# Order matches the pre-P3.5 hardcoded tuple exactly (github-oss LAST, per
# Adam's original wiring call — it stays dark until GITHUB_TOKEN lands, so it
# was deliberately ordered after the sources that work anonymously).
version: 1

adapter_sources:
  - hermes-hub
  - skills-sh
  - well-known
  - clawhub
  - lobehub
  - browse-sh
  - github-oss

github_taps:
  # Per-skill license repos (anthropics + openai ship a LICENSE.txt per skill
  # dir; repo_license=null forces per-skill resolution — decision #13 step 1).
  - source_id: github-anthropic
    repo: anthropics/skills
    path: "skills/"
    repo_license: null
    trust: trusted-source
    in_metasearch: false
  - source_id: github-openai
    repo: openai/skills
    path: "skills/.curated/"
    repo_license: null
    trust: curated-community
    in_metasearch: false
  # Whole-repo single-license repos — every skill is fetch-origin installable.
  - source_id: github-huggingface
    repo: huggingface/skills
    path: "skills/"
    repo_license: "Apache-2.0"
    trust: curated-community
    in_metasearch: false
  - source_id: github-nvidia
    repo: NVIDIA/skills
    path: "skills/"
    repo_license: "Apache-2.0 AND CC-BY-4.0"
    trust: trusted-source
    in_metasearch: false
  - source_id: github-gstack
    repo: garrytan/gstack
    path: ""
    repo_license: "MIT"
    trust: curated-community
    in_metasearch: false
  - source_id: github-superpowers
    repo: obra/superpowers
    path: "skills/"
    repo_license: "MIT"
    trust: curated-community
    in_metasearch: false
  # Corey Haines' marketing skill pack (47 skills, MIT). in_metasearch=true ->
  # first-class ranking; live-fetch (no SHA pin) so daily upstream edits
  # surface at query+install time.
  - source_id: github-marketing
    repo: coreyhaines31/marketingskills
    path: "skills/"
    repo_license: "MIT"
    trust: trusted-source
    in_metasearch: true

