# SSOT for tier display metadata.
# db_slug is the immutable contract: it matches DB column, API responses, and tests.
# display_name is what /pricing and /skills cards render.
# DO NOT rename db_slug without a coordinated DB migration + API + test sweep.
# To change display labels or pricing: edit ONLY this file, then run:
#   python3 scripts/recipes_stripe_sync.py --check-only   (verify)
#   python3 scripts/recipes_claims_reconcile.py --strict   (confirm no drift)
version: 1

tiers:
  free:
    db_slug: free
    display_name: Free
    price_usd: 0
    price_id_env: null
    accent_color: "#6B7280"
    badge: Free
    # PRIVATE-bundle cap SSOT (loopclose_3005 Phase A; free 0→1 in
    # evergreen_0206 Phase A — the on-ramp taste, decision #10). The ONLY
    # source of this number — bundle_routes.py, mcp/tools/bundle_stream.py,
    # auth_routes.py and checkout_routes.py all read it via
    # tier_labels.bundle_limit() and count against it via
    # services/bundle_quota.py. null = unlimited (reserved for a future
    # contact-us tier; no current tier is unlimited).
    #
    # WHAT IS METERED (autopilot_0308 M1, decision D-011): bundles whose
    # visibility is NOT 'public' — i.e. 'private' and 'team'. PUBLIC bundles
    # are UNLIMITED on every tier, including Free: free community curation is
    # a growth lever, so publishing a bundle must never cost the curator a
    # slot. Publishing an existing private bundle frees its slot immediately.
    # 'team' is metered because it is not community curation, and metering
    # only 'private' would be a one-click cap bypass.
    #
    # liked_0711 (Adam 2026-07-12): 1→2. Every user now auto-gets a system
    # "Liked" bundle (is_liked=true, always private) which counts toward this
    # cap, so free=1 left zero room to create even one real bundle. free=2 =
    # the auto-Liked bundle + one real editable private bundle (+ unlimited
    # public ones).
    bundle_limit: 2

    # ACTIVE-API-KEY cap SSOT (bundles_0811 P2.5, Adam 2026-08-10 lock #11).
    # UNCHANGED at 1 — deliberate, not an oversight. The key cap is the ONE
    # concrete reason to upgrade that is not bundle count; raising Free here
    # would remove it. Read via app.tier_labels.api_key_cap() — the ONLY
    # source of this number; app/api_key_routes.py enforces it and must never
    # hold a second copy as a Python literal.
    api_key_cap: 1

  pro:
    db_slug: pro
    display_name: Pro
    # Open-core hosted-convenience price (loopskill_run_0627). The whole registry
    # is free to self-host (MPL-2.0); Pro is "don't run it yourself", never a
    # feature gate. $9.95/mo is the LoopSkill hosted price — not a feature paywall.
    price_usd: 9.95
    # Canonical env var (RCP-INCIDENT-2026-05-11 Phase 6). The resolver
    # in app/subscription_service.py also accepts the legacy
    # WR_STRIPE_PRICE_COOK as a fallback until 2026-06-10.
    price_id_env: WR_STRIPE_PRICE_PRO
    price_id_env_legacy: WR_STRIPE_PRICE_COOK
    stripe_nickname: "Pro $9.95/mo"
    accent_color: "#3B82F6"
    badge: Pro
    # autopilot_0308 M1, decision D-004: 10 → 50 private bundles. The PRICE IS
    # UNCHANGED at $9.95 — D-004 moves the ceiling, not the bill. Public
    # bundles remain unlimited here as on every tier (D-011); see the free
    # block above for the full metering rule.
    bundle_limit: 50

    # ACTIVE-API-KEY cap SSOT (bundles_0811 P2.5, Adam 2026-08-10 lock #11):
    # 1 → 10. The verified defect: a $9.95/mo Pro customer had the SAME
    # single-key cap as Free, making every advertised workflow (one key per
    # client / machine / agent) impossible. Legacy alias `cook` follows this
    # value transparently via _canonical(). See free.api_key_cap above for
    # the SSOT contract.
    api_key_cap: 10

  pro_plus:
    db_slug: pro_plus
    display_name: Pro+
    # autopilot_0308 M2, D-003: public ladder is exactly 3 tiers (Free / Pro /
    # Enterprise-on-demand). `public: false` removes pro_plus from
    # /pricing, the tier picker, and marketing copy WITHOUT dropping the
    # db_slug — it stays fully functional in the data layer for (a) the
    # migration window (D-010: 5 live users migrate to pro via
    # scripts/migrate_pro_plus_to_pro.py, script-only, not auto-run) and
    # (b) Enterprise contracts afterwards, which sit on this slug rather
    # than a new one (hub D-005: Enterprise is a sales conversation, not a
    # self-serve price). Dropping this block, or the db_slug, is the
    # data-loss migration premortem risk #2 warns against — don't.
    public: false
    price_usd: 100
    # Canonical env var (RCP-INCIDENT-2026-05-11 Phase 6). The resolver
    # in app/subscription_service.py also accepts the legacy
    # WR_STRIPE_PRICE_STUDIO as a fallback until 2026-06-10.
    price_id_env: WR_STRIPE_PRICE_PRO_PLUS
    price_id_env_legacy: WR_STRIPE_PRICE_STUDIO
    stripe_nickname: "Pro+ $100/mo"
    accent_color: "#D4A017"
    badge: Pro+
    # Private bundles only (D-011); public bundles are unlimited.
    bundle_limit: 200

    # ACTIVE-API-KEY cap SSOT (bundles_0811 P2.5) — unchanged at 20. Legacy
    # aliases `operator`/`studio` follow this value via _canonical().
    api_key_cap: 20

# founding — a ONE-TIME payment SKU, NOT a subscription tier. Sibling key
# OUTSIDE the `tiers:` map on purpose (stripe-one-time-sku-on-subscription-rail
# skill, "SSOT pattern"): every loader that reads config/tiers.yaml
# (recipes_stripe_sync.py, recipes_claims_reconcile.py, tier_labels._tiers(),
# subscription_service._load_tiers_yaml()) iterates `data["tiers"]`, so this
# key is INVISIBLE to them — it can never be created as a recurring
# subscription and the tier-drift gates stay green automatically.
#
# grants_tier: pro — a Founding Member gets permanent Pro (subscription_tier=
# 'pro', subscription_status='active', period_end=NULL), matching what
# scripts/grant_comp_tier.py already writes for a comp'd Pro grant. mode:
# payment is the sole discriminator the webhook uses to route this event
# BEFORE the "skip non-subscription session" guard (see
# app/services/founding_service.py + app/subscription_service.py).
#
# price_usd + slot_cap are the SOLE numeric source — never hardcode 49 or 100
# anywhere else; read them via app.services.founding_service. Enforced by
# tests/test_founding_member.py::TestSsotGuard (tokenizer-based, fails CI if
# either literal reappears as a NUMBER token in the service/route files).
founding:
  display_name: Founding Member
  price_usd: 49
  slot_cap: 100
  grants_tier: pro
  mode: payment
  price_id_env: WR_STRIPE_PRICE_FOUNDING
  stripe_nickname: "Founding Member $49 one-time (capped 100)"
