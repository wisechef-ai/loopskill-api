[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Initial Phase-G scope: the rules that directly enforce plan §3 Phase G
# deliverables (blanket-exception audit + docstring sweep). Broader B/E/UP/I/F
# rule families surface ~660 pre-existing findings across the codebase — those
# are tracked as separate cleanup PRs (follow-up sprint: 'hygiene rollout
# phase 2'). The pattern is: each ratchet (B → BLE+D+B → BLE+D+B+E → …) is
# a tiny, reviewable PR.
select = [
    "BLE",  # flake8-blind-except (Phase G core deliverable)
    "D103", # pydocstyle: missing docstring in public function (Phase G core)
    "F401", # unused-import (cheap, catches dead re-exports)
    "F841", # unused-variable (cheap, catches forgotten assignments)
]
ignore = [
    "D103",  # docstrings enforced via pre-commit sweep, not ruff fail-the-build
    "E501",  # line-length handled by formatter
]
# Per-file ignores: keep BLE001 surfacing in app/ but allow blanket catch in
# alembic/scripts/tests where the pattern is contextually correct.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "E501", "BLE001"]
"app/discord_bot/*" = ["D103"]
"app/scripts/*" = ["D103"]
"app/crons/*" = ["D103"]
"alembic/*" = ["D103", "E501", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# A hung test must fail, not stall the job. Incident 2026-08-03: five
# Dependabot PRs (#165-#169) sat with `pytest + coverage` in_progress for
# hours because a test blocked on a slow third-party HTTP call. pytest-timeout
# was already installed in CI but never configured, so nothing ever tripped.
# 120s is ~2x the slowest legitimate test (the metasearch reconcile load
# harness paces ~60s of simulated polling by design).
timeout = 120
timeout_method = "thread"
# packaging/loopskill-mcp is a self-contained, independently-pip-installable
# sub-package with its own pyproject.toml + venv + test suite (see
# packaging/loopskill-mcp/README.md "Development"). Its tests import the
# `loopskill_mcp` package, which is never installed into the root repo's
# venv/CI job — collecting it here would hard-fail root `pytest` with
# ModuleNotFoundError. Same posture as excluding `.venv`: it's a distinct
# distributable unit, not part of this repo's own app test suite.
addopts = "--ignore=packaging"
markers = [
    "sandbox_linux_only: sandbox tests that require Linux (firejail/bwrap); skipped on macOS/darwin",
    "network: test is a genuine integration probe and may reach the public internet (exempt from the conftest outbound-network guard; non-hermetic, should not gate a merge)",
    "postgres_only: test requires a real reachable Postgres (TEST_DATABASE_URL/DATABASE_URL); self-skips when none is configured, matching the CI matrix's postgres leg",
    "settings_isolation: test module mutates WR_DATABASE_URL/WR_COOKIES_SECURE via monkeypatch/patch.dict and needs the app.config Settings lru_cache singleton cleared before/after (issue #298); scoped opt-in, NOT autouse repo-wide (see conftest.py _isolate_settings_singleton_if_marked and issue #298/#299 review history — a blanket autouse fixture broke 28 unrelated tests that patch.object() the live Settings instance)",
]
