[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopskill"
version = "0.3.0"
description = "Skill-portability CLI: import/diff/pull/apply across AI-agent skill directories. import/diff are offline by construction — no account, no network."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoopSkill" }]
keywords = ["skills", "agents", "portability", "cli", "lockfile"]
# Zero runtime dependencies on purpose: import/diff must work on a bare
# python3 with nothing else installed, and the offline gate (§ design
# constraints) is easiest to keep structural when there is nothing to vendor.
dependencies = []

[project.urls]
Homepage = "https://app.loopskill.io"
Repository = "https://github.com/wisechef-ai/loopskill-api"

[project.scripts]
loopskill = "loopskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["BLE", "F401", "F841"]
